    <script>
        //  Fetch Api :- talking to the server 
        // http methods : -get ,post ,put ,delete,patch ,options 
        let url = "https://dummyjson.com/products";
        // get
        function getdata() {
            let data = fetch(url, {
                method: "GET",
                headers: { "token": "xyz", "Authorization": "Bearer Token" }
            });
            data.then((res) => { return res.json() })
                .then((result) => { console.log(result.products) })
                .catch((err) => { console.log(err) })
                .finally(() => { console.log("fetch compelete"); })
        }
        function postdata() {
            let data = fetch(url + "/add", {
                method: "POST",
                body: JSON.stringify({ title: "first", price: 1000 }),
                headers: { "Content-Type": "application/json", }
            });
            data.then((res) => { return res.json() })
                .then((result) => { console.log(result) })
                .catch((err) => { console.log(err) })
                .finally(() => { console.log("fetch compelete"); })
        }
        postdata();
        function putdata() {

        }
        putdata();
