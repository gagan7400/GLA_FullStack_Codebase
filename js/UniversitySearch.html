<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --text: #1b2236;
      --muted: #6b7489;
      --border: #e3e7f0;
      --accent: #4f46e5;
      --accent-soft: #eceafd;
      --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 8px 24px rgba(20, 30, 60, .06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1320;
        --surface: #181d2f;
        --text: #eef0f8;
        --muted: #9aa3ba;
        --border: #272e45;
        --accent: #8b85ff;
        --accent-soft: #25264a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 20px;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -.02em;
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
    }

    /* Search input */
    .search {
      position: relative;
      max-width: 560px;
      margin: 0 auto 40px;
    }

    .search svg {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: var(--muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      font-size: 1rem;
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
    }

    /* Cards */
    .uni {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      transition: transform .2s, border-color .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .avatar {
      flex: none;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
    }

    .card h2 {
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: .8rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tag.plain {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .domain {
      color: var(--muted);
      font-size: .88rem;
      word-break: break-all;
    }

    .visit {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .2s;
    }

    .visit:hover {
      opacity: .88;
    }

    .status {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <header>
      <h1>Find Universities</h1>
      <p>Type a country name, for example India or Canada</p>
    </header>

    <div class="search">
      <input type="text" placeholder="Search by country..." autocomplete="off" aria-label="Search by country">
    </div>

    <div class="uni"></div>
  </div>
  <script>
    let input = document.querySelector(".search input");
    input.addEventListener("keyup", debounce(getUnivertsity, 100));

    function debounce(fn, delay) {
      let id = ""
      return () => {
        clearTimeout(id);
        id = setTimeout(() => {
          fn();
        }, delay)
      }
    };

    // task :- "http://universities.hipolabs.com/search?limit=10&name=universityname";
    async function getUnivertsity() {
      let data = await fetch("http://universities.hipolabs.com/search?limit=10&country=" + input.value)
      let res = await data.json();
      console.log(res);
      showdata(res)
    }
    function showdata(data) {
      let show = document.querySelector(".uni");
      show.innerHTML = "";
      data.map((v, index) => {
        const site = v.web_pages?.[0];
        const state = v["state-province"];
        show.innerHTML += `
          <article class="card">
            <div class="card-top">
              <h2>${v.name}</h2>
            </div>
            <div class="meta">
              <span class="tag">${v.country}</span>
              ${state ? `<span class="tag plain">${state}</span>` : ""}
            </div>
            ${v.domains?.[0] ? `<p class="domain">${v.domains[0]}</p>` : ""}
            ${site ? `<a class="visit" href="${site}" target="_blank" rel="noopener">Visit website &rarr;</a>` : ""}
          </article>`
      })
    }

  </script>
</body>

</html>
