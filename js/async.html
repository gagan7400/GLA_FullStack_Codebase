<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --bg: #eef1f6;
            --surface: #ffffff;
            --ink: #1b2233;
            --muted: #5d6679;
            --line: #d9deea;
            --accent: #3a4bd1;
            --accent-ink: #ffffff;
            --row-alt: #f6f8fc;
            --focus: rgba(58, 75, 209, .28);
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            padding: 40px 16px 64px;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .addtask {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.wide {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--muted);
        }

        input {
            font: inherit;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            width: 100%;
        }

        input:focus-visible,
        button:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--focus);
        }

        button {
            grid-column: 1 / -1;
            justify-self: start;
            font: inherit;
            font-weight: 700;
            background: var(--accent);
            color: var(--accent-ink);
            border: 0;
            border-radius: 8px;
            padding: 11px 22px;
            cursor: pointer;
            transition: transform .1s ease, filter .15s ease;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(1px);
        }

        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px;
        }

        th,
        td {
            text-align: left;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
        }

        th {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--muted);
            background: var(--row-alt);
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:nth-child(even) {
            background: var(--row-alt);
        }

        tbody tr:hover {
            background: var(--focus);
        }

        td:first-child,
        th:first-child {
            width: 64px;
            color: var(--muted);
        }

        td:nth-child(2) {
            font-weight: 700;
        }

        td:last-child {
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 560px) {
            .addtask {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <button onclick="getdata()">getdata</button>
    <button onclick="postdata()">postdata</button>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>SNO</th>
                    <th>Name</th>
                    <th>Body </th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    <script>
        let api = "https://jsonplaceholder.typicode.com/comments"
        function getdata() {
            let data = fetch(api, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "token": "xyz"
                }
            });
            console.log(data)//it print the promise return by fetch method;
            data.then((res) => { return res.json() }).then((result) => {
                console.log(result);
                showtask(result)
            }).catch((err) => { console.log(err) });
        }

        function showtask(comments) {
            let tbody = document.querySelector("tbody");
            tbody.innerHTML = "";
            comments.map((v, i) => {
                tbody.innerHTML += `
                <tr>
                    <td>${v.id}</td>
                    <td>${v.name}</td>
                    <td>${v.body}</td>
                    <td>${v.email}</td>
         </tr>`
            })
        }


        function postdata() {
            let data = fetch(api, {
                method: "POST",
                body: JSON.stringify({ name: "elon", title: "first title" }),
                headers: {
                    "Content-Type": "application/json",
                    "token": "xyz"
                }
            });
            data.then((res) => { return res.json() }).then((result) => {
                console.log("data post successfully", result)
            }).catch((err) => { console.log(err) });
        }
