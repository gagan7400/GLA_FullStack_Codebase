<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: aqua;
        }

        .doorbox {
            width: 250px;
            height: 300px;
            background: green;
            overflow: hidden;
            position: relative;
        }

        .door {
            width: 500px;
            height: 300px;
            background: yellow;
            border: 10px groove black;
            position: relative;
            transition: all 3s linear;
        }

        .doorbox:hover .door {
            transform: rotateY(89deg);
        }

        .doorhandle {
            width: 20px;
            height: 20px;
            border-radius: 100%;
            background: red;
            position: absolute;
            left: 0px;
            top: 50%
        }

        .greet {
            position: absolute;
            top: calc(50% - 50px);
            left: calc(50% - 50px);
            transform: scale(0.5);
            width: 100px;
            padding: 10px;
            background: linear-gradient(blue, white, blue);
            transition: all 1s linear 2.5s;
        }

        .doorbox:hover .greet {
            transform: scale(1.5);
        }
    </style>
</head>

<body>
    <div class="doorbox">
        <div class="greet">
            Welcome Home
        </div>
        <div class="door">
            DOOR
            <div class="doorhandle">

            </div>
        </div>
    </div>
</body>

</html>
